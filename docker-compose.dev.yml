services:
  frontend:
    build:
      dockerfile: Dockerfile.dev
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./frontend/package-lock.json
  backend:
    volumes:
      - ./backend/swagger.json:/usr/src/app/swagger.json
