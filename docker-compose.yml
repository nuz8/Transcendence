services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - transcend-net

  frontend:
    build:
      context: ./frontend
    image: frontend
    networks:
      - transcend-net

  backend:
    build:
      context: ./backend
    image: backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_NAME: ${POSTGRES_NAME}
    volumes:
      - avatar_uploads:/usr/src/app/public/avatars/uploads
    networks:
      - transcend-net

  db:
    image: postgres:17
    container_name: transcend-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - transcend-net

volumes:
  postgres_data:
  avatar_uploads:
  
networks:
  transcend-net:
    name: transcend-net
    driver: bridge