<mat-card>
  <mat-card-content>
    <form (submit)="onSubmit($event)" novalidate>
      @if (errorMessage()) {
        <p class="banner error-banner">{{ errorMessage() }}</p>
      }

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" autocomplete="email" [formField]="loginForm.email" />
        @for (error of loginForm.email().errors(); track error.kind) {
          <mat-error>{{ error.message }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" autocomplete="current-password" [formField]="loginForm.password" />
        @for (error of loginForm.password().errors(); track error.kind) {
          <mat-error>{{ error.message }}</mat-error>
        }
      </mat-form-field>

      <button mat-flat-button type="submit" [disabled]="loginForm().invalid() || submitting()">
        {{ submitting() ? 'Logging in…' : 'Log in' }}
      </button>

      <p class="switch-auth">Don't have an account yet? <a routerLink="/register">Register</a></p>
    </form>
  </mat-card-content>
</mat-card>
