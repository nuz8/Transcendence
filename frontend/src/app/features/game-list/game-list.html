<h1 matSubheader>Games</h1>
@if (games$ | async; as games) {
  <section class="results">
    @for (game of games; track game.id) {
      <mat-card class="game-card" appearance="outlined">
        <mat-card-header>
          <mat-card-title>{{ game.name }}</mat-card-title>
        </mat-card-header>
        <mat-card-actions>
          <button (click)="onClick(game.id)" matButton>Play!</button>
        </mat-card-actions>
      </mat-card>
    }
  </section>
}
